<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Crawler – CORS Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-weight: 400; font-size: 1.6rem; margin-bottom: 0.2rem; }
        h1 span { color: #60a5fa; }
        .sub { color: #94a3b8; margin-bottom: 2rem; }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .btn {
            background: #1e293b;
            border: none;
            color: #e2e8f0;
            padding: 0.6rem 1.8rem;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #334155;
        }
        .btn:hover { background: #334155; }
        .btn-primary { background: #2563eb; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-warning { background: #d97706; border-color: #d97706; }
        .btn-warning:hover { background: #b45309; }
        .btn-secondary { background: #7c3aed; border-color: #7c3aed; }
        .btn-secondary:hover { background: #6d28d9; }
        .result-box {
            background: #1e293b;
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1.5rem;
            border: 1px solid #334155;
            overflow: auto;
        }
        .result-box h3 {
            font-weight: 400;
            color: #94a3b8;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .raw {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 500px;
            overflow: auto;
            color: #cbd5e1;
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 0.5rem;
        }
        .error-msg { color: #f87171; padding: 0.5rem 0; }
        .success-msg { color: #4ade80; padding: 0.5rem 0; }
        .info-block {
            background: #0f172a;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
            margin: 1rem 0;
            color: #fde68a;
            font-size: 0.9rem;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1e293b;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }
        th { text-align: left; padding: 0.5rem 0.8rem; background: #0f172a; color: #94a3b8; border-bottom: 1px solid #334155; }
        td { padding: 0.4rem 0.8rem; border-bottom: 1px solid #2d3748; }
        .badge {
            display: inline-block; padding: 0.1rem 0.5rem; border-radius: 12px;
            font-size: 0.65rem; font-weight: 600;
        }
        .badge-ce { background: #1e3a5f; color: #60a5fa; }
        .badge-pe { background: #5f1e3a; color: #f472b6; }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 <span>New</span> Crawler · CORS Test</h1>
    <div class="sub">Endpoint: <code style="color:#60a5fa;">/crawler</code> &nbsp;|&nbsp; Auth: Anon Key</div>

    <div class="btn-group">
        <button class="btn btn-primary" id="directBtn">❶ Direct Fetch (with Key)</button>
        <button class="btn btn-warning" id="proxyBtn">❷ Via Proxy 1 (allorigins)</button>
        <button class="btn btn-secondary" id="proxyBtn2">❸ Via Proxy 2 (corsproxy.io)</button>
    </div>

    <div id="output">
        <div class="info-block">Click a button above. If direct fails with CORS, try the proxies — they bypass the browser restriction.</div>
    </div>
</div>

<script>
    (function() {
        const URL = 'https://lvionokaieygaarmcuwo.supabase.co/functions/v1/crawler';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2aW9ub2thaWV5Z2Fhcm1jdXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTA0OTAsImV4cCI6MjEwMzA2NjQ5MH0.Dew0TZDaaL_v8F2VtdRoNza9kis22vf6wg7iklE692Q';

        const output = document.getElementById('output');

        function showLoading() {
            output.innerHTML = `<div class="result-box"><span class="spinner"></span> Request in progress...</div>`;
        }

        function renderResult(title, body, isError = false, status = '') {
            let html = `<div class="result-box"><h3>${title}</h3>`;
            if (status) {
                html += `<div style="color:#94a3b8; margin-bottom:0.5rem;">Status: ${status}</div>`;
            }
            if (isError) {
                html += `<div class="error-msg">❌ ${body}</div>`;
            } else {
                html += `<div class="success-msg">✅ Request completed</div>`;
                // If body is JSON, try to pretty print
                let display = body;
                try {
                    const parsed = JSON.parse(body);
                    display = JSON.stringify(parsed, null, 2);
                    // Try to render a table if it's CE/PE data
                    const tableHtml = tryRenderTable(parsed);
                    if (tableHtml) {
                        display = tableHtml + '<hr style="border-color:#334155; margin:1rem 0;" />' + display;
                    }
                } catch (_) { /* keep as is */ }
                html += `<div class="raw">${display}</div>`;
            }
            html += `</div>`;
            output.innerHTML = html;
        }

        // Attempt to render CE/PE data as a table (for convenience)
        function tryRenderTable(json) {
            let records = json.rawData?.records?.data || json.records?.data || json.data || [];
            if (!Array.isArray(records) || records.length === 0) return null;

            let flat = [];
            records.forEach(item => {
                const base = { strikePrice: item.strikePrice, expiryDate: item.expiryDates || item.expiryDate };
                if (item.CE && typeof item.CE === 'object') {
                    flat.push({ ...base, ...item.CE, optionType: 'CE' });
                }
                if (item.PE && typeof item.PE === 'object') {
                    flat.push({ ...base, ...item.PE, optionType: 'PE' });
                }
            });
            if (flat.length === 0 && records[0]?.optionType) flat = records;
            if (flat.length === 0) return null;

            let table = `<table><thead><tr><th>Strike</th><th>Type</th><th>Last</th><th>Change %</th><th>IV</th><th>OI</th><th>Expiry</th></tr></thead><tbody>`;
            flat.slice(0, 20).forEach(item => {
                const isCe = item.optionType === 'CE' || (item.identifier && item.identifier.includes('CE'));
                const badge = isCe ? 'badge-ce' : 'badge-pe';
                const change = item.pChange ?? item.PChange;
                const changeStr = (change !== undefined && change !== null && !isNaN(change)) ? change.toFixed(2) + '%' : '—';
                const color = change > 0 ? '#4ade80' : change < 0 ? '#f87171' : '#94a3b8';
                table += `<tr>
                    <td><strong>${item.strikePrice ?? '—'}</strong></td>
                    <td><span class="badge ${badge}">${isCe ? 'CE' : 'PE'}</span></td>
                    <td>${item.lastPrice ?? item.buyPrice1 ?? '—'}</td>
                    <td style="color:${color}">${changeStr}</td>
                    <td>${item.impliedVolatility ?? '—'}</td>
                    <td>${item.openInterest ?? '—'}</td>
                    <td>${item.expiryDate || item.expiryDates || '—'}</td>
                </tr>`;
            });
            table += `</tbody></table>`;
            if (flat.length > 20) table += `<div style="color:#64748b; margin-top:0.5rem;">… and ${flat.length - 20} more</div>`;
            return table;
        }

        // ---------- 1. Direct Fetch ----------
        async function directFetch() {
            showLoading();
            try {
                const resp = await fetch(URL, {
                    headers: {
                        'Authorization': `Bearer ${ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                const text = await resp.text();
                renderResult('❶ Direct Fetch (with Key)', text, false, resp.status + ' ' + resp.statusText);
            } catch (err) {
                let msg = err.message;
                if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
                    msg = '❌ CORS BLOCKED: The server did not return Access-Control-Allow-Origin. Use a proxy button below.';
                }
                renderResult('❶ Direct Fetch', msg, true);
            }
        }

        // ---------- 2. Proxy 1 (allorigins) ----------
        async function proxyFetch1() {
            showLoading();
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(URL)}`;
            try {
                const resp = await fetch(proxyUrl);
                const json = await resp.json();
                const contents = json.contents || 'No content';
                const httpCode = json.status?.http_code || 'unknown';
                renderResult('❷ Via Proxy 1 (allorigins)', contents, false, `HTTP ${httpCode}`);
            } catch (err) {
                renderResult('❷ Via Proxy 1', 'Proxy request failed: ' + err.message, true);
            }
        }

        // ---------- 3. Proxy 2 (corsproxy.io) ----------
        async function proxyFetch2() {
            showLoading();
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(URL)}`;
            try {
                const resp = await fetch(proxyUrl);
                const text = await resp.text();
                // corsproxy.io usually returns the raw content, but sometimes wraps it.
                // Try to parse if it's JSON.
                let display = text;
                try {
                    const parsed = JSON.parse(text);
                    display = JSON.stringify(parsed, null, 2);
                } catch (_) { /* keep raw */ }
                renderResult('❸ Via Proxy 2 (corsproxy.io)', display, false, resp.status + ' ' + resp.statusText);
            } catch (err) {
                renderResult('❸ Via Proxy 2', 'Proxy request failed: ' + err.message, true);
            }
        }

        // ----- Bind buttons -----
        document.getElementById('directBtn').addEventListener('click', directFetch);
        document.getElementById('proxyBtn').addEventListener('click', proxyFetch1);
        document.getElementById('proxyBtn2').addEventListener('click', proxyFetch2);

        // Auto-run direct on load so you see the first error immediately.
        setTimeout(directFetch, 300);
    })();
</script>
</body>
</html>
