<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Data Check</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 1.5rem;
            color: #94a3b8;
        }
        h1 span {
            color: #60a5fa;
        }
        .loading {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #94a3b8;
            padding: 2rem 0;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #1e293b;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-box {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border-left: 4px solid #ef4444;
            margin: 1rem 0;
        }
        .data-section {
            margin-top: 1.5rem;
        }
        .data-section h2 {
            font-size: 1rem;
            font-weight: 500;
            color: #94a3b8;
            margin: 1.5rem 0 0.75rem 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }
        th {
            text-align: left;
            padding: 0.7rem 1rem;
            background: #0f172a;
            color: #94a3b8;
            font-weight: 500;
            border-bottom: 1px solid #334155;
        }
        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #2d3748;
            color: #e2e8f0;
        }
        tr:hover td {
            background: #2d3748;
        }
        .badge {
            display: inline-block;
            padding: 0.1rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-ce { background: #1e3a5f; color: #60a5fa; }
        .badge-pe { background: #5f1e3a; color: #f472b6; }
        .json-box {
            background: #0f172a;
            padding: 1.2rem;
            border-radius: 12px;
            overflow: auto;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 500px;
            border: 1px solid #1e293b;
            color: #cbd5e1;
        }
        .empty {
            color: #64748b;
            padding: 1.5rem 0;
            text-align: center;
        }
        .fetch-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }
        .fetch-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📡 <span>NSE</span> · Raw Data Inspector</h1>

    <div id="status"></div>

    <div class="data-section" id="tableSection" style="display:none;">
        <h2>📋 Parsed Options (CE / PE)</h2>
        <div id="tableWrapper"></div>
    </div>

    <div class="data-section" id="jsonSection" style="display:none;">
        <h2>📄 Raw JSON Response</h2>
        <div class="json-box" id="rawJson"></div>
    </div>

    <button class="fetch-btn" id="fetchBtn">⟳ Fetch again</button>
</div>

<script>
    (function() {
        const URL = 'https://kdneyzemvqzhwzztflvq.supabase.co/functions/v1/fetch-nse';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbmV5emVtdnF6aHd6enRmbHZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNDI2MzcsImV4cCI6MjA5NzcxODYzN30.qtbbxJqo6Jh4rQZ3QdpH5w7B6j3xrv_mOJ9gBQR3F8E';

        const statusEl = document.getElementById('status');
        const tableSection = document.getElementById('tableSection');
        const tableWrapper = document.getElementById('tableWrapper');
        const jsonSection = document.getElementById('jsonSection');
        const rawJsonEl = document.getElementById('rawJson');
        const fetchBtn = document.getElementById('fetchBtn');

        function setLoading() {
            statusEl.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Fetching data from Supabase ...</span>
                </div>
            `;
            tableSection.style.display = 'none';
            jsonSection.style.display = 'none';
        }

        function showError(msg) {
            statusEl.innerHTML = `<div class="error-box">⚠️ ${msg}</div>`;
            tableSection.style.display = 'none';
            jsonSection.style.display = 'none';
        }

        function renderTable(data) {
            if (!data || data.length === 0) {
                tableWrapper.innerHTML = `<div class="empty">No option records found.</div>`;
                return;
            }

            let html = `<table>
                <thead><tr>
                    <th>Strike</th>
                    <th>Type</th>
                    <th>Last Price</th>
                    <th>Change %</th>
                    <th>IV</th>
                    <th>OI</th>
                    <th>Volume</th>
                    <th>Expiry</th>
                    <th>Identifier</th>
                </tr></thead><tbody>`;

            data.forEach(item => {
                const isCe = item.optionType === 'CE' || (item.identifier && item.identifier.includes('CE'));
                const typeLabel = isCe ? 'CE' : 'PE';
                const badgeClass = isCe ? 'badge-ce' : 'badge-pe';

                const strike = item.strikePrice ?? '—';
                const last = item.lastPrice ?? item.buyPrice1 ?? '—';
                const pChange = item.pChange ?? item.PChange;
                const changeStr = (pChange !== undefined && pChange !== null && !isNaN(pChange))
                    ? pChange.toFixed(2) + '%'
                    : '—';
                const iv = item.impliedVolatility ?? '—';
                const oi = item.openInterest ?? '—';
                const vol = item.totalTradedVolume ?? '—';
                const expiry = item.expiryDate || item.expiryDates || '—';
                const ident = item.identifier || '—';

                html += `<tr>
                    <td><strong>${strike}</strong></td>
                    <td><span class="badge ${badgeClass}">${typeLabel}</span></td>
                    <td>${typeof last === 'number' ? last.toFixed(2) : last}</td>
                    <td style="color: ${pChange > 0 ? '#4ade80' : pChange < 0 ? '#f87171' : '#94a3b8'}">${changeStr}</td>
                    <td>${typeof iv === 'number' ? iv.toFixed(2) : iv}</td>
                    <td>${typeof oi === 'number' ? oi.toLocaleString() : oi}</td>
                    <td>${typeof vol === 'number' ? vol.toLocaleString() : vol}</td>
                    <td>${expiry}</td>
                    <td style="font-size:0.75rem; color:#94a3b8;">${ident}</td>
                </tr>`;
            });

            html += `</tbody></table>`;
            tableWrapper.innerHTML = html;
        }

        async function fetchData() {
            setLoading();

            try {
                const response = await fetch(URL, {
                    headers: {
                        'Authorization': `Bearer ${ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }

                const json = await response.json();

                // --- Show raw JSON ---
                rawJsonEl.textContent = JSON.stringify(json, null, 2);
                jsonSection.style.display = 'block';

                // --- Try to parse CE/PE records ---
                let records = json.rawData?.records?.data || json.records?.data || json.data || [];
                let flat = [];

                if (Array.isArray(records) && records.length > 0) {
                    records.forEach(item => {
                        const base = {
                            strikePrice: item.strikePrice,
                            expiryDate: item.expiryDates || item.expiryDate,
                            underlying: item.underlying || 'NIFTY',
                        };
                        if (item.CE && typeof item.CE === 'object') {
                            flat.push({ ...base, ...item.CE, optionType: 'CE', identifier: item.CE.identifier || `CE_${item.strikePrice}` });
                        }
                        if (item.PE && typeof item.PE === 'object') {
                            flat.push({ ...base, ...item.PE, optionType: 'PE', identifier: item.PE.identifier || `PE_${item.strikePrice}` });
                        }
                    });
                }

                // If flat is empty, maybe the data is already flat
                if (flat.length === 0 && Array.isArray(records) && records.length > 0) {
                    // check if first record has optionType or lastPrice directly
                    if (records[0].optionType || records[0].lastPrice) {
                        flat = records;
                    }
                }

                if (flat.length > 0) {
                    renderTable(flat);
                    tableSection.style.display = 'block';
                    statusEl.innerHTML = `<div style="color:#4ade80; padding:0.5rem 0;">✅ Loaded ${flat.length} options successfully.</div>`;
                } else {
                    // fallback: show a message that data exists but not in CE/PE format
                    tableSection.style.display = 'none';
                    statusEl.innerHTML = `<div style="color:#fbbf24; padding:0.5rem 0;">⚠️ Data received, but no CE/PE records found. Check raw JSON below.</div>`;
                }

            } catch (err) {
                showError('Failed to fetch: ' + err.message);
                jsonSection.style.display = 'none';
                tableSection.style.display = 'none';
            }
        }

        // --- Auto-fetch on load ---
        fetchData();

        // --- Manual refresh ---
        fetchBtn.addEventListener('click', fetchData);

    })();
</script>
</body>
</html>
