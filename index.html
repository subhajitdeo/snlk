<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Option Chain Pro · Dashboard</title>
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            padding: 1.5rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-weight: 400;
            font-size: 1.6rem;
        }
        h1 span {
            color: #60a5fa;
        }
        .spot-box {
            background: #1e293b;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid #334155;
            font-size: 1.1rem;
        }
        .spot-box strong {
            color: #facc15;
        }
        .controls {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            background: #1e293b;
            border: none;
            color: #e2e8f0;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #334155;
        }
        .btn:hover {
            background: #334155;
        }
        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-warning {
            background: #d97706;
            border-color: #d97706;
        }
        .btn-warning:hover {
            background: #b45309;
        }
        .status {
            color: #94a3b8;
            font-size: 0.85rem;
            padding: 0.3rem 0;
        }
        .status .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1e293b;
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ----- Table ----- */
        .table-wrap {
            overflow-x: auto;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 0.5rem 0;
            margin-top: 0.5rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 700px;
        }
        th {
            text-align: center;
            padding: 0.6rem 0.4rem;
            background: #0f172a;
            color: #94a3b8;
            font-weight: 500;
            border-bottom: 2px solid #2d3748;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        td {
            text-align: center;
            padding: 0.4rem 0.3rem;
            border-bottom: 1px solid #2d3748;
            vertical-align: middle;
            position: relative;
        }
        .strike-cell {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .atm-row {
            outline: 2px solid #005eff;
            outline-offset: -1px;
            background: rgba(0, 94, 255, 0.08);
        }

        /* ----- Heatmap classes (applied to cells) ----- */
        .ce-oi {
            background: #ffb3b3 !important;
        }
        .pe-oi {
            background: #00FF88 !important;
        }
        .ce-chg {
            background: #ffb3b3 !important;
        }
        .pe-chg {
            background: #00FF88 !important;
        }
        .vol {
            background: #00F7FF !important;
        }
        .yellow {
            background: #F7FF00 !important;
        }

        .pos {
            color: #4ade80 !important;
            font-weight: 700;
        }
        .neg {
            color: #f87171 !important;
            font-weight: 700;
        }

        .pct {
            display: block;
            font-size: 0.6rem;
            opacity: 0.8;
            font-weight: 700;
            margin-top: 2px;
            color: #000;
        }
        .net-oi {
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 2px;
        }

        /* ----- Error / Info ----- */
        .error-msg {
            color: #f87171;
            padding: 1rem;
            text-align: center;
            background: #2d1f1f;
            border-radius: 8px;
            margin: 1rem 0;
        }
        .info-block {
            background: #0f172a;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #fbbf24;
            margin: 1rem 0;
            color: #fde68a;
            font-size: 0.9rem;
        }
        .hidden {
            display: none !important;
        }
        .text-muted {
            color: #94a3b8;
        }

        /* Scrollable table body */
        .table-scroll {
            max-height: 70vh;
            overflow-y: auto;
        }
        .table-scroll table thead {
            position: sticky;
            top: 0;
            z-index: 3;
        }
        /* Column widths */
        .col-strike {
            min-width: 70px;
        }
        .col-num {
            min-width: 60px;
        }
        .col-small {
            min-width: 50px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📡 <span>NSE</span> Option Chain · Pro Dashboard</h1>
            <div class="controls">
                <span class="spot-box" id="spotDisplay">Spot: <strong id="spotValue">—</strong></span>
                <button class="btn btn-primary" id="refreshBtn">⟳ Refresh</button>
                <button class="btn btn-warning" id="toggleProxyBtn">🌐 Use Proxy</button>
                <span id="statusMsg" class="status">Ready</span>
            </div>
        </header>

        <div id="errorContainer"></div>

        <div class="table-wrap">
            <div class="table-scroll" id="tableScroll">
                <table id="optionTable">
                    <thead>
                        <tr>
                            <th class="col-strike">Strike</th>
                            <th class="col-num">CE OI</th>
                            <th class="col-small">CE Chg</th>
                            <th class="col-num">CE Vol</th>
                            <th class="col-num">CE LTP</th>
                            <th class="col-num">PE LTP</th>
                            <th class="col-num">PE Vol</th>
                            <th class="col-small">PE Chg</th>
                            <th class="col-num">PE OI</th>
                            <th class="col-num">Net OI</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="10" class="text-muted" style="padding:2rem;">Loading data…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="info-block" id="infoBox">
            ⚡ Auto‑refresh every 2.5s · ATM ±5 strikes highlighted · Heatmap: max = bright, ≥75% = yellow
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- Configuration ----------
            const ENDPOINT = 'https://lvionokaieygaarmcuwo.supabase.co/functions/v1/crawler';
            const ANON_KEY = 'A0OTAsImV4cCI6MjEwMzA2NjQ5MH0.Dew0TZDaaL_v8F2VtdRoNza9kis22vf6wg7iklE692Q';
            const RANGE = 5; // ±5 strikes
            const REFRESH_MS = 2500;

            let useProxy = false;
            let refreshTimer = null;

            // DOM refs
            const tbody = document.getElementById('tableBody');
            const spotValueEl = document.getElementById('spotValue');
            const statusMsg = document.getElementById('statusMsg');
            const errorContainer = document.getElementById('errorContainer');
            const toggleProxyBtn = document.getElementById('toggleProxyBtn');
            const refreshBtn = document.getElementById('refreshBtn');

            // ---------- Helpers ----------
            function parseNum(v) {
                if (!v) return 0;
                if (typeof v === 'number') return v;
                const cleaned = String(v).replace(/,/g, '').replace(/--/g, '0');
                const num = parseFloat(cleaned);
                return isNaN(num) ? 0 : num;
            }

            function setStatus(msg, loading = false) {
                statusMsg.innerHTML = loading ?
                    `<span class="spinner"></span> ${msg}` :
                    msg;
            }

            function showError(msg) {
                errorContainer.innerHTML = `<div class="error-msg">❌ ${msg}</div>`;
            }

            function clearError() {
                errorContainer.innerHTML = '';
            }

            // ---------- Fetch with proxy fallback ----------
            async function fetchData() {
                let url = ENDPOINT;
                if (useProxy) {
                    // Use allorigins as proxy
                    url = `https://api.allorigins.win/get?url=${encodeURIComponent(ENDPOINT)}`;
                }

                const headers = {};
                if (!useProxy) {
                    headers['Authorization'] = `Bearer ${ANON_KEY}`;
                    headers['Content-Type'] = 'application/json';
                }

                const response = await fetch(url, { headers });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                let data;
                if (useProxy) {
                    const proxyJson = await response.json();
                    // allorigins wraps content in .contents
                    data = JSON.parse(proxyJson.contents);
                } else {
                    data = await response.json();
                }
                return data;
            }

            // ---------- Extract option chain from JSON ----------
            function extractChain(data) {
                // Try to find records.data
                let records = data.records?.data || data.data || data.rawData?.records?.data || [];
                if (!Array.isArray(records) || records.length === 0) {
                    throw new Error('No option chain data found in response.');
                }

                // Try to get spot from underlyingValue or first strike
                let spot = data.underlyingValue || data.spot || data.underlying || null;
                if (!spot || isNaN(spot)) {
                    // Try to infer from strikes: find the one with highest total OI? Or just use median.
                    // For simplicity, we'll compute ATM as the strike closest to the median of strikes.
                    const strikes = records.map(item => parseNum(item.strikePrice)).filter(v => v > 0);
                    if (strikes.length) {
                        const sorted = strikes.sort((a, b) => a - b);
                        spot = sorted[Math.floor(sorted.length / 2)];
                    } else {
                        spot = 0;
                    }
                }
                spot = parseNum(spot);

                // Build array of items with CE/PE
                const items = records.map(item => {
                    const strike = parseNum(item.strikePrice);
                    const ce = item.CE || item.ce || {};
                    const pe = item.PE || item.pe || {};
                    return {
                        strike,
                        ce: {
                            oi: parseNum(ce.openInterest || ce.oi),
                            chg: parseNum(ce.changeInOpenInterest || ce.changeinOpenInterest || ce.chg),
                            vol: parseNum(ce.totalTradedVolume || ce.volume || ce.vol),
                            ltp: parseNum(ce.lastPrice || ce.ltp),
                        },
                        pe: {
                            oi: parseNum(pe.openInterest || pe.oi),
                            chg: parseNum(pe.changeInOpenInterest || pe.changeinOpenInterest || pe.chg),
                            vol: parseNum(pe.totalTradedVolume || pe.volume || pe.vol),
                            ltp: parseNum(pe.lastPrice || pe.ltp),
                        }
                    };
                }).filter(item => item.strike > 0);

                if (items.length === 0) {
                    throw new Error('No valid strike data found.');
                }

                return { spot, items };
            }

            // ---------- Render table ----------
            function renderDashboard(spot, items) {
                // Find ATM strike (closest to spot)
                let atmStrike = null;
                let minDiff = Infinity;
                items.forEach(item => {
                    const diff = Math.abs(item.strike - spot);
                    if (diff < minDiff) {
                        minDiff = diff;
                        atmStrike = item.strike;
                    }
                });

                if (atmStrike === null) {
                    throw new Error('Could not determine ATM strike.');
                }

                // Filter within ±RANGE strikes (each strike step is 50, so range = RANGE*50)
                const visible = items.filter(item => Math.abs(item.strike - atmStrike) <= RANGE * 50);
                if (visible.length === 0) {
                    throw new Error('No strikes within ±5 of ATM.');
                }

                // Sort by strike ascending
                visible.sort((a, b) => a.strike - b.strike);

                // Prepare arrays for heatmap
                const ceOI = [];
                const peOI = [];
                const ceChg = [];
                const peChg = [];
                const ceVol = [];
                const peVol = [];

                visible.forEach(item => {
                    ceOI.push(item.ce.oi);
                    peOI.push(item.pe.oi);
                    ceChg.push(item.ce.chg);
                    peChg.push(item.pe.chg);
                    ceVol.push(item.ce.vol);
                    peVol.push(item.pe.vol);
                });

                // Max values for heatmap
                const maxCeOI = Math.max(...ceOI, 1);
                const maxPeOI = Math.max(...peOI, 1);
                const maxCeChg = Math.max(...ceChg.map(Math.abs), 1);
                const maxPeChg = Math.max(...peChg.map(Math.abs), 1);
                const maxCeVol = Math.max(...ceVol, 1);
                const maxPeVol = Math.max(...peVol, 1);

                // Build table rows
                let html = '';
                visible.forEach((item, idx) => {
                    const isAtm = (item.strike === atmStrike);
                    const ce = item.ce;
                    const pe = item.pe;

                    // Compute pct for heatmap (based on max)
                    const pctCeOI = (ce.oi / maxCeOI) * 100;
                    const pctPeOI = (pe.oi / maxPeOI) * 100;
                    const pctCeChg = (Math.abs(ce.chg) / maxCeChg) * 100;
                    const pctPeChg = (Math.abs(pe.chg) / maxPeChg) * 100;
                    const pctCeVol = (ce.vol / maxCeVol) * 100;
                    const pctPeVol = (pe.vol / maxPeVol) * 100;

                    // Determine classes for heatmap (max = specific class, >=75% = yellow)
                    const ceOICls = (ce.oi === maxCeOI) ? 'ce-oi' : (pctCeOI >= 75 ? 'yellow' : '');
                    const peOICls = (pe.oi === maxPeOI) ? 'pe-oi' : (pctPeOI >= 75 ? 'yellow' : '');
                    const ceChgCls = (Math.abs(ce.chg) === maxCeChg) ? 'ce-chg' : (pctCeChg >= 75 ? 'yellow' : '');
                    const peChgCls = (Math.abs(pe.chg) === maxPeChg) ? 'pe-chg' : (pctPeChg >= 75 ? 'yellow' : '');
                    const ceVolCls = (ce.vol === maxCeVol) ? 'vol' : (pctCeVol >= 75 ? 'yellow' : '');
                    const peVolCls = (pe.vol === maxPeVol) ? 'vol' : (pctPeVol >= 75 ? 'yellow' : '');

                    // Change sign classes
                    const ceChgSign = ce.chg > 0 ? 'pos' : (ce.chg < 0 ? 'neg' : '');
                    const peChgSign = pe.chg > 0 ? 'pos' : (pe.chg < 0 ? 'neg' : '');

                    // Net OI = PE OI - CE OI
                    const netOI = pe.oi - ce.oi;
                    const netCls = netOI >= 0 ? 'pos' : 'neg';

                    // Row class for ATM
                    const rowCls = isAtm ? 'atm-row' : '';

                    html += `<tr class="${rowCls}">`;
                    html += `<td class="strike-cell">${item.strike}</td>`;

                    // CE OI
                    html += `<td class="${ceOICls}">${ce.oi.toLocaleString()}
                                <span class="pct">${Math.round(pctCeOI)}%</span></td>`;
                    // CE Chg
                    html += `<td class="${ceChgCls} ${ceChgSign}">${ce.chg > 0 ? '+' : ''}${ce.chg.toLocaleString()}
                                <span class="pct">${Math.round(pctCeChg)}%</span></td>`;
                    // CE Vol
                    html += `<td class="${ceVolCls}">${ce.vol.toLocaleString()}
                                <span class="pct">${Math.round(pctCeVol)}%</span></td>`;
                    // CE LTP
                    html += `<td>${ce.ltp.toFixed(2)}</td>`;
                    // PE LTP
                    html += `<td>${pe.ltp.toFixed(2)}</td>`;
                    // PE Vol
                    html += `<td class="${peVolCls}">${pe.vol.toLocaleString()}
                                <span class="pct">${Math.round(pctPeVol)}%</span></td>`;
                    // PE Chg
                    html += `<td class="${peChgCls} ${peChgSign}">${pe.chg > 0 ? '+' : ''}${pe.chg.toLocaleString()}
                                <span class="pct">${Math.round(pctPeChg)}%</span></td>`;
                    // PE OI
                    html += `<td class="${peOICls}">${pe.oi.toLocaleString()}
                                <span class="pct">${Math.round(pctPeOI)}%</span></td>`;
                    // Net OI
                    html += `<td class="${netCls}">${netOI >= 0 ? '+' : ''}${netOI.toLocaleString()}</td>`;

                    html += '</tr>';
                });

                tbody.innerHTML = html;
                spotValueEl.textContent = spot.toFixed(2);

                // Show number of rows
                setStatus(`✅ ${visible.length} strikes · ATM ${atmStrike}`);
            }

            // ---------- Main refresh ----------
            async function refreshData() {
                clearError();
                setStatus('Fetching data…', true);

                try {
                    const data = await fetchData();
                    const { spot, items } = extractChain(data);
                    renderDashboard(spot, items);
                } catch (err) {
                    console.error(err);
                    showError(err.message || 'Failed to load data. Check console.');
                    setStatus('❌ Error');
                    tbody.innerHTML =
                        `<tr><td colspan="10" class="text-muted" style="padding:2rem;">${err.message || 'Failed to load'}</td></tr>`;
                }
            }

            // ---------- Toggle proxy ----------
            function toggleProxy() {
                useProxy = !useProxy;
                toggleProxyBtn.textContent = useProxy ? '🌐 Using Proxy' : '🌐 Use Proxy';
                toggleProxyBtn.classList.toggle('btn-warning', useProxy);
                toggleProxyBtn.classList.toggle('btn-primary', !useProxy);
                refreshData();
            }

            // ---------- Start auto-refresh ----------
            function startAutoRefresh() {
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(refreshData, REFRESH_MS);
            }

            // ---------- Init ----------
            async function init() {
                // Bind events
                refreshBtn.addEventListener('click', refreshData);
                toggleProxyBtn.addEventListener('click', toggleProxy);

                // First load
                await refreshData();
                startAutoRefresh();
            }

            // Run
            init();

        })();
    </script>
</body>
</html>
